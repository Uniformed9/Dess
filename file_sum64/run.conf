run_operator() {

    # 用户只需要传入一个待计算文件
    if [ $# -ne 1 ]; then
        echo "Usage:"
        echo "  ./run.sh host_file_sum64 <input_file>"
        echo ""
        echo "Example:"
        echo "  ./run.sh host_file_sum64 ./env.sh"
        return 1
    fi

    INPUT_FILE="$1"

    # Host 可执行程序
    HOST="$OP_DIR/build/host_file_sum64"

    # FPGA XCLBIN 文件
    XCLBIN="$OP_DIR/build/file_sum64.xclbin"

    # 检查 Host 是否存在并且可执行
    if [ ! -x "$HOST" ]; then
        echo "[ERROR] Host executable not found or not executable:"
        echo "        $HOST"
        return 1
    fi

    # 检查 XCLBIN 是否存在
    if [ ! -f "$XCLBIN" ]; then
        echo "[ERROR] xclbin not found:"
        echo "        $XCLBIN"
        return 1
    fi

    # 检查输入文件是否存在
    if [ ! -f "$INPUT_FILE" ]; then
        echo "[ERROR] Input file not found:"
        echo "        $INPUT_FILE"
        return 1
    fi

    echo "=========================================="
    echo "[RUN]"
    echo "Host   : $HOST"
    echo "XCLBIN : $XCLBIN"
    echo "Input  : $INPUT_FILE"
    echo "=========================================="

    "$HOST" "$XCLBIN" "$INPUT_FILE"
}
