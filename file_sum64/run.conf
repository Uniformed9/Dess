run_operator() {

    # file_sum 只需要用户传入一个参数：待计算文件
    if [ $# -ne 1 ]; then
        echo "Usage:"
        echo "  ./run.sh file_sum <input_file>"
        echo ""
        echo "Example:"
        echo "  ./run.sh file_sum ./data/test.bin"
        return 1
    fi

    INPUT_FILE="$1"

    # Host 可执行文件
    HOST="$OP_DIR/build/host_file_sum64"

    # FPGA xclbin
    XCLBIN="$OP_DIR/build/file_sum64.hw.xclbin"

    # --------------------------------------------------
    # 检查 Host
    # --------------------------------------------------
    if [ ! -x "$HOST" ]; then
        echo "[ERROR] Host executable not found or not executable:"
        echo "        $HOST"
        return 1
    fi

    # --------------------------------------------------
    # 检查 XCLBIN
    # --------------------------------------------------
    if [ ! -f "$XCLBIN" ]; then
        echo "[ERROR] xclbin not found:"
        echo "        $XCLBIN"
        return 1
    fi

    # --------------------------------------------------
    # 检查输入文件
    # --------------------------------------------------
    if [ ! -f "$INPUT_FILE" ]; then
        echo "[ERROR] Input file not found:"
        echo "        $INPUT_FILE"
        return 1
    fi

    echo "[RUN]"
    echo "$HOST $XCLBIN $INPUT_FILE"

    # --------------------------------------------------
    # 执行
    # --------------------------------------------------
    "$HOST" "$XCLBIN" "$INPUT_FILE"
}
